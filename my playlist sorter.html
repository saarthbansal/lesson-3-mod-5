<!DOCTYPE html><html>
    <head>
        <title>my playlist sorter</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container py-4"></div>
        <h1 class="mb-1">my playlist sorter</h1>
        <p class="text-muted mb-4">sort and label your muisic playlist using javascript array methods</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">song names</h3>
                <button class="btn btn-primary mr-4" onclick="sortAZ()">sort A to Z</button>
                <button class="btn btn-warning mr-4" onclick="sortZA()">sort Z to A</button>
                <div id="nameresult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">play count</h3>
                <button class="btn btn-primary mr-2" onclick="sortleast()">least played first</button>
                <button class="btn btn-warning" onclick="sortmost()">most played first</button>
                <div id="countresult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">label every play count</h3>
                <button class="btn btn-primary" onclick="addlabel()">add plays label</button>
                <div id="labelresult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <script>
            var songs=["zoom", "haha", "big bang", "doom", "pop"];
            var plays=[90, 100, 6794, 300, 79];

            document.getElementById("nameresult").innerHTML="songs" + songs;
            document.getElementById("countresult").innerHTML = "plays" + plays;
            document.getElementById("labelresult").innerHTML = "press the button above!";

            function sortAZ(){
                songs.sort();
                document.getElementById("nameresult").innerHTML="A to Z:" + songs;
            }
             function sortZA() {
                    songs.sort();
                    songs.reverse();
                    document.getElementById("nameresult").innerHTML = "Z to A:" + songs;
                }
                 function sortleast() {
                        plays.sort(function (a, b) { return a-b;});
                        document.getElementById("countresult").innerHTML = "least played first:" + plays;
                    }
                     function sortmost() {
                            plays.sort(function (a, b) { return b - a; });
                            document.getElementById("countresult").innerHTML = "most played first:" + plays;
                        }
                        function addlabel() {
                            var l = plays.map(function (c){return c + "plays";});
                            document.getElementById("labelresult").innerHTML="labelled:" + l;
                            }
        </script>
    </body>
</html>
